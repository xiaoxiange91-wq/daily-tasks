<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f5c4a">
<title>学习记录本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#0f5c4a;
  --green-light:#17795f;
  --green-pale:#e8f2ef;
  --gold:#c9a227;
  --text:#1c2b26;
  --sub:#6b7f78;
  --line:#dfe8e4;
  --bg:#f5f8f7;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  font-size:16px;line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}

/* 顶部 */
header{
  background:var(--green);color:#fff;
  padding:calc(18px + env(safe-area-inset-top)) 20px 18px;
  margin:0 -16px 20px;
  border-radius:0 0 22px 22px;
}
.h-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.streak{font-size:13px;opacity:.92;white-space:nowrap}
.streak b{font-size:20px;font-weight:700;color:#ffe9a8}
.today-hint{font-size:12.5px;opacity:.78;margin-top:6px}

/* 卡片 */
.card{
  background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 1px 3px rgba(15,92,74,.07),0 6px 20px rgba(15,92,74,.04);
  margin-bottom:14px;
}
.card-title{
  font-size:13px;font-weight:700;color:var(--green);
  letter-spacing:.5px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:0 0 auto}
label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 5px;font-weight:500}
label:first-of-type{margin-top:0}
textarea,input[type=text],input[type=number]{
  width:100%;border:1.5px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:15.5px;font-family:inherit;
  background:#fbfdfc;color:var(--text);
  transition:border-color .18s,background .18s;
  -webkit-appearance:none;resize:vertical;
}
textarea:focus,input:focus{outline:none;border-color:var(--green-light);background:#fff}
textarea{min-height:64px;line-height:1.55}

/* 科目快捷 */
.subjects{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.sub{
  padding:7px 13px;border-radius:20px;font-size:13.5px;font-weight:600;
  border:1.5px solid var(--line);background:#fff;color:var(--sub);
  transition:all .15s;cursor:pointer;
}
.sub.on{background:var(--green);border-color:var(--green);color:#fff}

/* 按钮 */
.btn{
  display:block;width:100%;padding:15px;border:none;border-radius:13px;
  font-size:16.5px;font-weight:700;font-family:inherit;
  background:var(--green);color:#fff;cursor:pointer;
  transition:transform .1s,opacity .15s;
  letter-spacing:.5px;
}
.btn:active{transform:scale(.985);opacity:.9}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.gold{background:var(--gold);color:#fff}
.btn.small{padding:11px;font-size:14.5px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-size:15px;font-weight:700;color:var(--text)}
.cal-nav{
  width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;color:var(--green);font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.cal-nav:active{background:var(--green-pale)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-week span{text-align:center;font-size:11px;color:var(--sub);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--sub);
  background:#f7faf9;position:relative;
}
.cal-day.empty{background:transparent}
.cal-day.done{background:var(--green);color:#fff}
.cal-day.done::after{
  content:"";position:absolute;bottom:4px;width:3.5px;height:3.5px;
  border-radius:50%;background:var(--gold);
}
.cal-day.today{box-shadow:0 0 0 2px var(--gold) inset}
.cal-day.future{color:#c8d4d0}
.cal-legend{display:flex;gap:14px;margin-top:11px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend-done{background:var(--green)}
.legend-today{background:#fff;border:2px solid var(--gold)}

/* 记录列表 */
.rec{padding:13px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.rec-date{font-size:13px;font-weight:700;color:var(--green)}
.rec-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2.5px 8px;border-radius:20px;background:var(--green-pale);color:var(--green);font-weight:600}
.rec-body{font-size:14.5px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.rec-sec{margin-top:7px}
.rec-sec .k{font-size:11.5px;font-weight:700;color:var(--gold);display:block;margin-bottom:2px}
.rec-sec .v{font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.del{
  border:none;background:none;color:#c8a0a0;font-size:12px;
  cursor:pointer;padding:3px 7px;font-family:inherit;border-radius:6px;
}
.del:active{background:#fbeaea}

/* 导出区 */
.export-box{background:var(--green-pale);border-radius:12px;padding:13px;margin-top:11px}
.export-box textarea{
  min-height:150px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
  background:#fff;
}
.hint{font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.5}

/* 空状态 */
.empty-state{text-align:center;padding:26px 10px;color:var(--sub);font-size:14px}
.empty-state .big{font-size:34px;margin-bottom:9px;opacity:.35}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(80px);
  background:rgba(28,43,38,.94);color:#fff;
  padding:11px 22px;border-radius:22px;font-size:14px;font-weight:600;
  opacity:0;transition:all .28s;pointer-events:none;z-index:99;
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底部保存栏 */
.save-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(245,248,247,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
}
.save-bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.save-bar .btn{flex:1;padding:15px;font-size:16.5px}

/* 折叠 */
.collapse-head{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
}
.collapse-head .arrow{transition:transform .2s;color:var(--sub);font-size:12px}
.collapse-head.open .arrow{transform:rotate(90deg)}
.collapse-body{display:none;margin-top:12px}
.collapse-body.show{display:block}
</style>
</head>
<body>

<header>
  <div class="h-top">
    <h1>学习记录本</h1>
    <div class="streak">连续 <b id="streakNum">0</b> 天</div>
  </div>
  <div class="today-hint" id="todayHint">今天还没有记录</div>
</header>

<div class="wrap">

  <!-- 今日记录 -->
  <div class="card">
    <div class="card-title"><span class="dot"></span>今日记录 · <span id="todayDate"></span></div>

    <label>今天学了哪些科目</label>
    <div class="subjects" id="subjects">
      <div class="sub on" data-s="数学">数学</div>
      <div class="sub on" data-s="英语">英语</div>
      <div class="sub" data-s="432">432统计</div>
      <div class="sub" data-s="政治">政治</div>
    </div>

    <label>今天真正学到了什么（写具体，别写"学了数学"）</label>
    <textarea id="learned" placeholder="例：
概率论第1节：样本空间、事件的关系与运算
做了5道题，全对
听力：精听第1篇 Section A，跟读3遍"></textarea>

    <label>今天卡住的地方</label>
    <textarea id="stuck" placeholder="例：
古典概型的排列组合还是不熟
贝叶斯公式做题时容易绕晕"></textarea>

    <label>明天要做的</label>
    <textarea id="tomorrow" placeholder="例：
概率论第2节 + 做5题
单词新60 复习200
听力精听第2篇"></textarea>
  </div>

  <!-- 打卡日历 -->
  <div class="card">
    <div class="cal-head">
      <div class="cal-month" id="calMonth">2026年10月</div>
      <div style="display:flex;gap:7px">
        <button class="cal-nav" id="prevM">‹</button>
        <button class="cal-nav" id="nextM">›</button>
      </div>
    </div>
    <div class="cal-week">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span><i class="legend-done"></i>已记录</span>
      <span><i class="legend-today"></i>今天</span>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="card">
    <div class="collapse-head" id="histToggle">
      <div class="card-title" style="margin:0"><span class="dot"></span>历史记录 <span id="recCount" style="color:var(--sub);font-weight:500"></span></div>
      <div class="arrow">▶</div>
    </div>
    <div class="collapse-body" id="histBody">
      <div id="recList"></div>
    </div>
  </div>

  <!-- 导出 -->
  <div class="card">
    <div class="collapse-head" id="exportToggle">
      <div class="card-title" style="margin:0"><span class="dot"></span>导出数据</div>
      <div class="arrow">▶</div>
    </div>
    <div class="collapse-body" id="exportBody">
      <div class="export-box">
        <textarea id="exportText" readonly placeholder="点下面的按钮生成文本"></textarea>
        <div class="hint">生成后长按文本全选复制，发给 AI 帮你分析。</div>
      </div>
      <div class="btn-row" style="margin-top:11px">
        <button class="btn ghost small" id="genExport">生成文本</button>
        <button class="btn ghost small" id="copyExport">复制</button>
      </div>
    </div>
  </div>

  <!-- 危险操作 -->
  <div class="card">
    <div class="collapse-head" id="dangerToggle">
      <div class="card-title" style="margin:0;color:#b4796f"><span class="dot" style="background:#d4a5a0"></span>其他</div>
      <div class="arrow">▶</div>
    </div>
    <div class="collapse-body" id="dangerBody">
      <div class="hint" style="margin-top:0;margin-bottom:10px">
        数据存在这台设备的浏览器里。换设备/清缓存会丢，建议每周导出一次保存。
      </div>
      <div class="btn-row">
        <button class="btn ghost small" id="importBtn">导入数据</button>
        <button class="btn ghost small" id="clearBtn" style="color:#b4796f;border-color:#e0c0bc">清空全部</button>
      </div>
      <textarea id="importArea" placeholder="把导出的文本粘贴到这里，然后点导入" style="margin-top:11px;display:none;min-height:100px;font-size:12.5px"></textarea>
      <button class="btn ghost small" id="doImport" style="margin-top:9px;display:none">确认导入</button>
    </div>
  </div>

</div>

<!-- 底部保存 -->
<div class="save-bar">
  <div class="inner">
    <button class="btn" id="saveBtn">保存今天的记录</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var KEY = 'study_log_v1';
  var CAL_KEY = 'study_cal_v1';

  // ---------- 工具 ----------
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateStr(d){
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function today(){ return dateStr(new Date()); }
  function parseDate(s){
    var p = s.split('-');
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function fmtCN(s){
    var p = s.split('-');
    return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日';
  }
  function weekdayCN(s){
    var w = ['周日','周一','周二','周三','周四','周五','周六'];
    return w[parseDate(s).getDay()];
  }
  function $(id){ return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }

  // ---------- 存储 ----------
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function save(data){
    try{
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    }catch(e){
      toast('保存失败：存储空间可能已满');
      return false;
    }
  }

  var data = load();

  // ---------- 日期显示 ----------
  var T = today();
  $('todayDate').textContent = fmtCN(T) + ' ' + weekdayCN(T);

  // ---------- 科目选择 ----------
  var subjects = [];
  function syncSubjects(){
    subjects = [];
    var els = document.querySelectorAll('#subjects .sub.on');
    for(var i=0;i<els.length;i++){ subjects.push(els[i].getAttribute('data-s')); }
  }
  var subEls = document.querySelectorAll('#subjects .sub');
  for(var i=0;i<subEls.length;i++){
    subEls[i].addEventListener('click', function(){
      this.classList.toggle('on');
      syncSubjects();
    });
  }
  syncSubjects();

  // ---------- 回填今日 ----------
  var cur = data[T] || null;
  if(cur){
    $('learned').value = cur.learned || '';
    $('stuck').value = cur.stuck || '';
    $('tomorrow').value = cur.tomorrow || '';
    if(cur.subjects && cur.subjects.length){
      var all = document.querySelectorAll('#subjects .sub');
      for(var j=0;j<all.length;j++){
        all[j].classList.remove('on');
      }
      for(var k=0;k<all.length;k++){
        if(cur.subjects.indexOf(all[k].getAttribute('data-s')) >= 0){
          all[k].classList.add('on');
        }
      }
      syncSubjects();
    }
  }

  // ---------- 保存 ----------
  $('saveBtn').addEventListener('click', function(){
    var learned = $('learned').value.trim();
    var stuck = $('stuck').value.trim();
    var tomorrow = $('tomorrow').value.trim();

    if(!learned && !stuck && !tomorrow){
      toast('至少写一样内容吧');
      return;
    }

    data[T] = {
      learned: learned,
      stuck: stuck,
      tomorrow: tomorrow,
      subjects: subjects.slice(),
      updated: new Date().toISOString()
    };

    if(save(data)){
      toast('已保存 ✓');
      updateStreak();
      renderCalendar();
      renderHistory();
      updateHint();
    }
  });

  // ---------- 连续天数 ----------
  function calcStreak(){
    var d = new Date();
    var n = 0;
    // 如果今天没记录，从昨天开始算
    if(!data[dateStr(d)]){ d.setDate(d.getDate()-1); }
    while(true){
      var s = dateStr(d);
      if(data[s]){ n++; d.setDate(d.getDate()-1); }
      else break;
      if(n > 3650) break;
    }
    return n;
  }
  function updateStreak(){
    $('streakNum').textContent = calcStreak();
  }

  function updateHint(){
    var c = data[T];
    if(c){
      $('todayHint').textContent = '今天已记录 ✓ 可以随时补充';
    }else{
      $('todayHint').textContent = '今天还没有记录';
    }
  }

  // ---------- 日历 ----------
  var calY, calM;
  (function(){
    var n = new Date();
    calY = n.getFullYear();
    calM = n.getMonth();
  })();

  function renderCalendar(){
    $('calMonth').textContent = calY + '年' + (calM+1) + '月';
    var grid = $('calGrid');
    grid.innerHTML = '';

    var first = new Date(calY, calM, 1);
    var startW = first.getDay();
    var days = new Date(calY, calM+1, 0).getDate();

    var t = today();

    for(var i=0;i<startW;i++){
      var e = document.createElement('div');
      e.className = 'cal-day empty';
      grid.appendChild(e);
    }
    for(var d=1; d<=days; d++){
      var ds = calY+'-'+pad(calM+1)+'-'+pad(d);
      var el = document.createElement('div');
      el.className = 'cal-day';
      el.textContent = d;
      if(data[ds]) el.classList.add('done');
      if(ds === t) el.classList.add('today');
      if(ds > t) el.classList.add('future');
      grid.appendChild(el);
    }
  }

  $('prevM').addEventListener('click', function(){
    calM--; if(calM < 0){ calM = 11; calY--; }
    renderCalendar();
  });
  $('nextM').addEventListener('click', function(){
    calM++; if(calM > 11){ calM = 0; calY++; }
    renderCalendar();
  });

  // ---------- 历史记录 ----------
  function renderHistory(){
    var list = $('recList');
    var keys = Object.keys(data).sort().reverse();
    $('recCount').textContent = keys.length ? '（' + keys.length + ' 天）' : '';

    if(!keys.length){
      list.innerHTML = '<div class="empty-state"><div class="big">📖</div>还没有记录<br>写第一条吧</div>';
      return;
    }

    var html = [];
    for(var i=0;i<keys.length;i++){
      var dk = keys[i];
      var r = data[dk];
      var tags = '';
      if(r.subjects && r.subjects.length){
        tags = '<div class="rec-tags">';
        for(var s=0;s<r.subjects.length;s++){
          tags += '<span class="tag">'+esc(r.subjects[s])+'</span>';
        }
        tags += '</div>';
      }
      var body = '';
      if(r.learned){
        body += '<div class="rec-sec"><span class="k">学到了</span><div class="v">'+esc(r.learned)+'</div></div>';
      }
      if(r.stuck){
        body += '<div class="rec-sec"><span class="k">卡住的</span><div class="v">'+esc(r.stuck)+'</div></div>';
      }
      if(r.tomorrow){
        body += '<div class="rec-sec"><span class="k">明天</span><div class="v">'+esc(r.tomorrow)+'</div></div>';
      }

      html.push(
        '<div class="rec">' +
          '<div class="rec-head">' +
            '<div class="rec-date">' + fmtCN(dk) + ' ' + weekdayCN(dk) + '</div>' +
            '<button class="del" data-d="' + esc(dk) + '">删除</button>' +
          '</div>' +
          tags + body +
        '</div>'
      );
    }
    list.innerHTML = html.join('');

    var dels = list.querySelectorAll('.del');
    for(var z=0; z<dels.length; z++){
      dels[z].addEventListener('click', function(){
        var dk = this.getAttribute('data-d');
        if(confirm('删除 ' + fmtCN(dk) + ' 的记录？')){
          delete data[dk];
          save(data);
          renderHistory();
          renderCalendar();
          updateStreak();
          if(dk === T){
            $('learned').value = '';
            $('stuck').value = '';
            $('tomorrow').value = '';
          }
          updateHint();
          toast('已删除');
        }
      });
    }
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- 折叠 ----------
  function bindCollapse(headId, bodyId){
    $(headId).addEventListener('click', function(){
      this.classList.toggle('open');
      $(bodyId).classList.toggle('show');
    });
  }
  bindCollapse('histToggle','histBody');
  bindCollapse('exportToggle','exportBody');
  bindCollapse('dangerToggle','dangerBody');

  // ---------- 导出 ----------
  $('genExport').addEventListener('click', function(){
    var keys = Object.keys(data).sort().reverse();
    if(!keys.length){ toast('还没有记录'); return; }

    var out = [];
    out.push('# 学习记录导出');
    out.push('导出时间：' + fmtCN(today()) + ' ' + weekdayCN(today()));
    out.push('记录天数：' + keys.length + ' 天');
    out.push('');

    for(var i=0;i<keys.length;i++){
      var dk = keys[i];
      var r = data[dk];
      out.push('## ' + fmtCN(dk) + ' ' + weekdayCN(dk));
      if(r.subjects && r.subjects.length){
        out.push('科目：' + r.subjects.join('、'));
      }
      if(r.learned){ out.push('【学到了】'); out.push(r.learned); }
      if(r.stuck){ out.push('【卡住的】'); out.push(r.stuck); }
      if(r.tomorrow){ out.push('【明天要做】'); out.push(r.tomorrow); }
      out.push('');
    }

    $('exportText').value = out.join('\n');
    toast('已生成，长按复制');
  });

  $('copyExport').addEventListener('click', function(){
    var ta = $('exportText');
    if(!ta.value){ toast('先点"生成文本"'); return; }
    ta.removeAttribute('readonly');
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(!ok && navigator.clipboard){
      navigator.clipboard.writeText(ta.value).then(function(){
        toast('已复制 ✓');
      }).catch(function(){ toast('请长按手动复制'); });
    }else if(ok){
      toast('已复制 ✓');
    }
    ta.setAttribute('readonly','readonly');
  });

  // ---------- 导入 ----------
  $('importBtn').addEventListener('click', function(){
    var a = $('importArea');
    var b = $('doImport');
    var show = a.style.display === 'none';
    a.style.display = show ? 'block' : 'none';
    b.style.display = show ? 'block' : 'none';
  });

  $('doImport').addEventListener('click', function(){
    var txt = $('importArea').value.trim();
    if(!txt){ toast('先粘贴内容'); return; }

    var added = 0;
    var curDate = null;
    var lines = txt.split('\n');
    var mode = '';

    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      var m = line.match(/^##\s*(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m){
        curDate = m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
        if(!data[curDate]){
          data[curDate] = {learned:'',stuck:'',tomorrow:'',subjects:[],updated:new Date().toISOString()};
          added++;
        }
        mode = '';
        continue;
      }
      if(!curDate) continue;
      var m2 = line.match(/^科目：(.+)$/);
      if(m2){
        data[curDate].subjects = m2[1].split('、');
        continue;
      }
      if(line.indexOf('【学到了】') === 0){ mode='learned'; continue; }
      if(line.indexOf('【卡住的】') === 0){ mode='stuck'; continue; }
      if(line.indexOf('【明天要做】') === 0){ mode='tomorrow'; continue; }
      if(mode && line.trim()){
        data[curDate][mode] = (data[curDate][mode] ? data[curDate][mode]+'\n' : '') + line;
      }
    }

    if(save(data)){
      toast('导入完成，新增 ' + added + ' 天');
      renderHistory();
      renderCalendar();
      updateStreak();
      updateHint();
      $('importArea').value = '';
    }
  });

  // ---------- 清空 ----------
  $('clearBtn').addEventListener('click', function(){
    if(!confirm('确认清空全部记录？此操作不可恢复。\n建议先导出备份。')) return;
    if(!confirm('真的确定吗？再点一次。')) return;
    data = {};
    localStorage.removeItem(KEY);
    renderHistory();
    renderCalendar();
    updateStreak();
    updateHint();
    $('learned').value = '';
    $('stuck').value = '';
    $('tomorrow').value = '';
    toast('已清空');
  });

  // ---------- 初始化 ----------
  updateStreak();
  renderCalendar();
  renderHistory();
  updateHint();

})();
</script>
</body>
</html>
